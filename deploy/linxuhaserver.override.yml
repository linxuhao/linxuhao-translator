# Target-host override (linxuhaserver): GPU-bound vLLM/ASR/media-gen stay on
# linxuhao-ai, so point the gateway AND the mcp-server (agent-tools OCR/ASR/
# T2I/T2M backend) at them over Tailscale. vllm-qwen/qwen3-asr/media-gen are
# not started here (no GPU).
services:
  gateway:
    environment:
      - BRAIN_ENGINE_URL=http://linxuhao-ai:8000/v1/chat/completions
      - ASR_ENGINE_URL=http://linxuhao-ai:9000/v1/chat/completions
      - ASR_TRANSCRIBE_URL=http://linxuhao-ai:9000/v1/audio/transcriptions
    extra_hosts:
      - "linxuhao-ai:100.68.74.107"
  mcp-server:
    environment:
      - VLLM_URL=http://linxuhao-ai:8000/v1/chat/completions
      - ASR_URL=http://linxuhao-ai:9000/v1/chat/completions
      - MEDIA_GEN_URL=http://linxuhao-ai:9010
      - MEDIA_GEN_PUBLIC_URL=http://linxuhao-ai:9010
    extra_hosts:
      - "linxuhao-ai:100.68.74.107"
