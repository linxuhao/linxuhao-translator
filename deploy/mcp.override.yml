# MCP 层(linxuhaserver)的 override。以前它把 mcp-server 的构建和 gateway 的四个文件指向另一个
# checkout(vip-gateway-unified);那些分支已并入 main,base compose 里的 ./mcp-server 与 ./gateway/app
# 就是同一份代码,所以这里只剩两台机器之间真正不同的东西:调度器地址与凭据。
services:
  mcp-server:
    environment:
      GPU_SERVICE_URL: http://${GPU_HOST:-linxuhao-ai}:9041
      # Base for download URLs handed to callers. The shared module appends /files/, and
      # mcp-server serves those at /video/files/, so the /video belongs here.
      VIDEO_PUBLIC_URL: https://agentmcp.linxuhao.app/video
    volumes:
      - ${GPU_LOCK_DIR:-/home/linxuhao/.local/state/vip-gpu}/GPU_API_TOKEN:/run/secrets/GPU_API_TOKEN:ro
  gateway:
    environment:
      GPU_SERVICE_URL: http://${GPU_HOST:-linxuhao-ai}:9041
    volumes:
      - ${GPU_LOCK_DIR:-/home/linxuhao/.local/state/vip-gpu}/GPU_API_TOKEN:/run/secrets/GPU_API_TOKEN:ro
