# 随身翻译官 — the translator product only.
#
# Since 2026-09-16 this repository holds just the gateway. Everything else that used to be
# in this file has its own repository and its own compose project:
#
#   cloudflare tunnel        ~/cloudflare-tunnel on the front host
#   MCP layer (mcp_server)   https://github.com/linxuhao/agentmcp
#   GPU layer (engines, video runtime, media shell, continuity)
#                            https://github.com/linxuhao/gpu-runtime
#
# The gateway has no GPU. ASR and the LLM are reached over HTTP on the GPU layer's facade
# (GPU_SERVICE_URL) with a bearer token mounted from a file.
#
#   docker compose up -d --build
services:
  gateway:
    build:
      context: ./gateway
    container_name: api_gateway
    ports:
      - "5000:5000"
    volumes:
      - ./gateway/app:/app
      # The GPU layer's bearer token, as a file (never an env var).
      - ${GPU_LOCK_DIR:-/home/linxuhao/.local/state/vip-gpu}/GPU_API_TOKEN:/run/secrets/GPU_API_TOKEN:ro
    environment:
      GPU_SERVICE_URL: http://${GPU_HOST:-linxuhao-ai}:9041
    # 容器内不走 Tailscale MagicDNS, 所以显式映射 AI 机。
    extra_hosts:
      - "linxuhao-ai:${LINXUHAO_AI_IP:-100.68.74.107}"
    restart: unless-stopped

# ==========================================
# [网络层] 默认网 = 隧道的会合网
# ==========================================
#
# 本项目的默认网直接命名为会合网, 所以 gateway 隐式就在上面, 隧道按容器名 api_gateway
# 找到它 —— AItelier / ActiveMemoryIndex / agentmcp 都是同一种写法: 只给名字, 不写 external:。
#
# 为什么不写 external: true —— external 的网一旦缺失, compose 会在任何容器
# 启动之前整个拒绝运行。那正是当初把网络挪进可选 `-f` 叠加文件的理由, 而那个
# 叠加文件在 2026-08-25 造成了一次故障: 一个忘了带 -f 的 `up -d` 把 AItelier
# 重建成不带会合网的样子, 容器 healthy、localhost 照答 200、公网路径没了,
# 没有一处报错。一个裸 `docker compose up -d` 就能静默摘掉的部署属性, 不算属性。
#
# 代价说清楚: 网络已存在而不是本项目建的时, compose 每次 up 会告警一句
# "exists but was not created for project"。行为正确, 只是唠叨 —— 选它是因为
# 另一头的失败模式看不见, 而告警看得见。
#
# 名字打错不会报错, 而是默默建一张空网。公网黑了而 localhost 还答时, 先查:
#   docker inspect cloudflare_tunnel --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
networks:
  default:
    name: ${CF_EDGE_NETWORK:-cloudflare_edge}
