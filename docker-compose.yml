services:
  # ==========================================
  # [网络层] Cloudflare 穿透隧道 (全球极速访问)
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}

  # ----------------------------------------
  # 调度中枢: API Gateway & PWA
  # ----------------------------------------
  gateway:
    build:
      context: ./gateway
    container_name: api_gateway
    ports:
      - "5000:5000"
    volumes:
      - ./gateway/app:/app
    restart: unless-stopped

  # ==========================================
  # GPU 0 (7900 XTX): vLLM 推理引擎 (2026 SOTA 架构)
  # ==========================================
  vllm-qwen:
    image: vllm/vllm-openai-rocm:latest #for support of --reasoning-config, it gets dropped on latest nightly
    container_name: vllm_qwen
    ports:
      - "8000:8000"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    environment:
      - HIP_VISIBLE_DEVICES=0
      - VLLM_USE_TRITON_AWQ=1
      - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_SLEEP_WHEN_IDLE=1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./qwen3.5/thinking.jinja:/app/thinking.jinja
    entrypoint: []
    # 【关键修复 2】：手动指定 bash 执行环境
    command: >
      vllm serve sokada4/Qwen3.8-27B-GPTQ-Int4
      --dtype float16
      --max-model-len 12288
      --gpu-memory-utilization 0.95
      --max-num-seqs 16
      --chat-template /app/thinking.jinja
      --served-model-name qwen3
      --trust-remote-code
    restart: unless-stopped

 # ==========================================
  # 文件名: docker-compose.audio.yml
  # 架构定位: GPU 1 (7800 XT) - 纯正 ROCm 原生听觉与发声节点
  # ==========================================
  qwen3-asr:
    build:
        context: ./qwen3-asr
    container_name: qwen3_asr
    ports:
      - "9000:8000"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    environment:
      - HIP_VISIBLE_DEVICES=1
      - VLLM_USE_TRITON_AWQ=1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_SLEEP_WHEN_IDLE=1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    entrypoint: []
    # 【关键修复 2】：手动指定 bash 执行环境
    command: >
      vllm serve Qwen/Qwen3-ASR-0.6B
      --dtype float16
      --max-model-len 4096
      --gpu-memory-utilization 0.20
      --max-num-seqs 32
      --served-model-name qwen3-asr
      --trust-remote-code
    restart: unless-stopped

  # ==========================================
  # MCP Server - ASR/OCR 工具 (Tailscale 私有网络)
  # ==========================================
  mcp-server:
    build:
      context: ./mcp-server
    container_name: mcp_server
    ports:
      - "9003:9003"
    environment:
      - ASR_URL=http://qwen3_asr:8000/v1/chat/completions
      - VLLM_URL=http://vllm_qwen:8000/v1/chat/completions
      - SEARXNG_URL=http://linxuhaserver:8888/search
      - MEDIA_GEN_URL=http://media_gen:9010
      - GENERATED_HOST_DIR=/home/linxuhao/vip-gateway/generated
    volumes:
      - ./generated:/generated
      - ./mcp-server/app.py:/app/app.py
    restart: unless-stopped

  # ==========================================
  # GPU 1 (7800 XT): 媒体生成 (文生图 FLUX.2 Klein + 文生音乐 ACE-Step)
  # ==========================================
  media-gen:
    build:
      context: ./media-gen
    container_name: media_gen
    ports:
      - "9010:9010"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - "44"
      - "992"
    environment:
      - HIP_VISIBLE_DEVICES=1
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - MAX_IMAGE_SIZE=768
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./media-gen/app.py:/app/app.py
      - ./cache/torch:/root/.cache/torch
      - ./cache/triton:/root/.triton
      - ./generated:/generated
    restart: unless-stopped
