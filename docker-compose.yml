services:
  # ==========================================
  # [网络层] Cloudflare 穿透隧道 (全球极速访问)
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}

  # ----------------------------------------
  # 调度中枢: API Gateway & PWA
  # ----------------------------------------
  gateway:
    build:
      context: ./gateway
    container_name: api_gateway
    ports:
      - "5000:5000"
    volumes:
      - ./gateway/app:/app
    environment:
      - BRAIN_ENGINE_URL=${BRAIN_ENGINE_URL:-http://linxuhao-ai:8000/v1/chat/completions}
      - ASR_ENGINE_URL=${ASR_ENGINE_URL:-http://linxuhao-ai:9000/v1/chat/completions}
      - ASR_TRANSCRIBE_URL=${ASR_TRANSCRIBE_URL:-http://linxuhao-ai:9000/v1/audio/transcriptions}
    # 容器内不走 Tailscale MagicDNS, 所以显式映射 AI 机。
    extra_hosts:
      - "linxuhao-ai:${LINXUHAO_AI_IP:-100.68.74.107}"
    restart: unless-stopped

  # ==========================================
  # GPU 0 (7900 XTX): vLLM 推理引擎 (2026 SOTA 架构)
  # ==========================================
  vllm-qwen:
    image: vllm/vllm-openai-rocm:latest #for support of --reasoning-config, it gets dropped on latest nightly
    container_name: vllm_qwen
    ports:
      - "8000:8000"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    environment:
      - HIP_VISIBLE_DEVICES=0
      - VLLM_USE_TRITON_AWQ=1
      - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_SLEEP_WHEN_IDLE=1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./qwen3.5/thinking.jinja:/app/thinking.jinja
    entrypoint: []
    # 【关键修复 2】：手动指定 bash 执行环境
    command: >
      vllm serve sokada4/Qwen3.8-27B-GPTQ-Int4
      --dtype float16
      --max-model-len 12288
      --gpu-memory-utilization 0.95
      --max-num-seqs 16
      --chat-template /app/thinking.jinja
      --served-model-name qwen3
      --trust-remote-code
    restart: unless-stopped

 # ==========================================
  # 文件名: docker-compose.audio.yml
  # 架构定位: GPU 1 (7800 XT) - 纯正 ROCm 原生听觉与发声节点
  # ==========================================
  qwen3-asr:
    build:
        context: ./qwen3-asr
    container_name: qwen3_asr
    ports:
      - "9000:8000"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    environment:
      - HIP_VISIBLE_DEVICES=1
      - VLLM_USE_TRITON_AWQ=1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_SLEEP_WHEN_IDLE=1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    entrypoint: []
    # 【关键修复 2】：手动指定 bash 执行环境
    command: >
      vllm serve Qwen/Qwen3-ASR-0.6B
      --dtype float16
      --max-model-len 4096
      --gpu-memory-utilization 0.25
      --max-num-seqs 32
      --served-model-name qwen3-asr
      --trust-remote-code
    restart: unless-stopped

  # ==========================================
  # MCP Server - ASR/OCR 工具 (Tailscale 私有网络)
  # ==========================================
  mcp-server:
    build:
      context: ./mcp-server
    container_name: mcp_server
    ports:
      - "9003:9003"
    environment:
      # 默认一律写跨机形式。mcp-server 跑在 linxuhaserver 上而推理都在 linxuhao-ai,
      # 用容器内主机名 (qwen3_asr / media_gen) 只在同机时成立 —— 实测跨机 curl 返回 000。
      # 跨机形式两台机都通 (AI 机上它指向自己的 Tailscale 地址, 正好是发布出来的端口),
      # 所以不需要任何 override 文件。
      - ASR_URL=${ASR_URL:-http://linxuhao-ai:9000/v1/chat/completions}
      - VLLM_URL=${VLLM_URL:-http://linxuhao-ai:8000/v1/chat/completions}
      - SEARXNG_URL=${SEARXNG_URL:-http://linxuhaserver:8888/search}
      - MEDIA_GEN_URL=${MEDIA_GEN_URL:-http://linxuhao-ai:9010}
      # 工具返回给调用方的下载 URL 前缀, 必须是调用方能解析的地址
      - MEDIA_GEN_PUBLIC_URL=${MEDIA_GEN_PUBLIC_URL:-http://linxuhao-ai:9010}
    # 容器内不走 Tailscale MagicDNS, 所以显式映射 AI 机。
    extra_hosts:
      - "linxuhao-ai:${LINXUHAO_AI_IP:-100.68.74.107}"
    restart: unless-stopped

  # ==========================================
  # GPU 1 (7800 XT): 媒体生成 (文生图 FLUX.2 Klein + 文生音乐 Stable Audio 3 Small) — 后端 ggml/Vulkan
  # ==========================================
  media-gen:
    build:
      context: ./media-gen
    container_name: media_gen
    ports:
      - "9010:9010"
    devices:
      # Vulkan 只需要 /dev/dri; /dev/kfd 是 ROCm 的计算接口, 已不再使用
      - "/dev/dri:/dev/dri"
    group_add:
      - "44"    # video
      - "992"   # render
    environment:
      - VULKAN_DEVICE=1     # 1 = RX 7800 XT (RADV NAVI32); 0 = 7900 XTX, 被 vllm 占用
      - MAX_IMAGE_SIZE=1024
      - SD_SERVER=http://sd_server:9020
      - AUDIO_SERVER=http://audiocpp_server:9021
      - ENGINE_WAIT_S=180      # 引擎冷启动要从磁盘重读 12.6 GB 权重
      - AUDIO_IDLE_UNLOAD_S=120   # 空闲 120s 后卸掉音频模型, 显卡回到零常驻
      - RETENTION_DAYS=30      # 生成产物保留 30 天, 0 = 不清理
    volumes:
      - ./media-gen/app.py:/app/app.py
      - ./generated:/generated
      # 角色参考音: 长期资产, 和有 30 天清理的 ./generated 分开放
      - ./actors:/actors
      - ./subjects:/subjects
    depends_on:
      - sd-server
      - audiocpp-server
    restart: unless-stopped

  # ==========================================
  # GPU 1: ggml/Vulkan 推理引擎 (常驻, 模型不重载)
  # ROCm 在这张卡上 VAE 解码静默算错且非确定 —— 见 ROCm/ROCm#6633。
  # Vulkan/RADV 走运行时编译的 SPIR-V, 不查 per-gfx 预编译 kernel 表, 结果正确且更快。
  # 二进制与权重在仓库外 (体积大), 构建方式见 media-gen/README-vulkan.md。
  # ==========================================
  sd-server:
    build:
      context: ./engines
    container_name: sd_server
    ports:
      - "9020:9020"
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "44"
      - "992"
    volumes:
      - ${AUDIOCPP_ROOT:-/home/linxuhao/audiocpp}/stable-diffusion.cpp:/work:ro
      - ${AUDIOCPP_ROOT:-/home/linxuhao/audiocpp}/sdmodels2:/models/sd:ro
    command: >
      /work/build/bin/sd-server
      --diffusion-model /models/sd/flux-2-klein-4b-Q8_0.gguf
      --vae /models/sd/flux2-vae.safetensors
      --llm /models/sd/qwen_3_4b.safetensors
      --vae-format flux2 --backend vulkan1
      --diffusion-fa --offload-to-cpu --cfg-scale 1.0 --steps 4
      --listen-ip 0.0.0.0 --listen-port 9020
    restart: unless-stopped

  audiocpp-server:
    build:
      context: ./engines
    container_name: audiocpp_server
    ports:
      - "9021:9021"
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "44"
      - "992"
    volumes:
      - ${AUDIOCPP_ROOT:-/home/linxuhao/audiocpp}/audio.cpp:/work:ro
      - ${AUDIOCPP_ROOT:-/home/linxuhao/audiocpp}/models:/models/audio:ro
      - ./media-gen/audio_server.json:/conf/audio_server.json:ro
      # voice_ref 的路径由引擎解析, 所以它也要看得见同一个 /actors
      - ./actors:/actors:ro
    command: >
      /work/build/linux-vulkan-release/bin/audiocpp_server
      --config /conf/audio_server.json --no-ui
    restart: unless-stopped

# ==========================================
# [网络层] 共享网络 —— 名字钉死, 不许从目录名推导
# ==========================================
#
# 这张网是本项目的隐式默认网, 但别的项目 (AItelier / activememoryindex /
# mcp_server ...) 是按名字加入进来的, cloudflared 靠它打到各家的服务端口。
# 名字不写出来时, compose 从项目名推导, 而项目名来自目录名 —— 也就是说
# 把 ~/vip-gateway 改个名, 或者设一个 COMPOSE_PROJECT_NAME, 这张网就换了
# 名字, 而每一个加入者都会默默新建一张空网: 容器全都 healthy, 各自的
# localhost 全都正常, 只有跨项目的调用全断, 没有一处会报错。
#
# 2026-08-25 AItelier 那边刚以另一种触发方式吃过同一种沉默失败 (忘了带
# 叠加文件的 -f), 排查花了一晚上。名字是别人依赖的契约, 契约就要写出来。
#
# 写死字面量而不是用变量: 加入者需要变量 (每台机器的网可能不同叫法),
# 拥有者需要的是稳定 —— 参数化只会多一个「改了变量所有加入者一起断」的坑。
#
# 钉上同名是完全的空操作: 实测容器不重建、网络 id 不变。
networks:
  default:
    name: vip-gateway_default
